# Minimal nginx main config for the Base44 dev sandbox.
# The repository checkout is owned by root with mode 0700, so the stock image's
# `user nginx;` workers cannot traverse it and every request returns 403.
# Running workers as root inside the (dev-only) container lets nginx serve the
# bind-mounted source directly. Not intended for production.
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Media files are large but the site is read-only, so keep uploads modest.
    client_max_body_size  16m;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Never cache during development so edits show up on refresh.
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
